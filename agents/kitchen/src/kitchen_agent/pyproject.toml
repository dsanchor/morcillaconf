[project]
name = "morcillaconf-kitchen-agent"
version = "0.1.0"
description = "Agente de cocina A2A con chef coordinador y especialistas."
requires-python = ">=3.13"
dependencies = [
    "morcillaconf-contracts",
    "morcillaconf-observability",
    "a2a-sdk[http-server]==1.1.2",
    "agent-framework-foundry",
    "agent-framework-orchestrations==1.2.0",
    "azure-identity>=1.25",
    "debugpy",
    "httpx>=0.28,<1",
    "mcp>=1.30,<2",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1,<2",
    "starlette>=0.49,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
kitchen-agent = "kitchen_agent.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
morcillaconf-contracts = { path = "../../../../packages/contracts", editable = true }
morcillaconf-observability = { path = "../../../../packages/observability", editable = true }

[tool.setuptools.packages.find]
include = ["kitchen_agent*"]

[tool.setuptools.package-data]
kitchen_agent = ["instructions.md"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
