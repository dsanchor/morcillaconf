[project]
name = "morcillaconf-restaurant-agent"
version = "0.1.0"
description = "Camarero orquestador para la demo del restaurante multiagente."
requires-python = ">=3.13"
dependencies = [
    "morcillaconf-contracts",
    "morcillaconf-observability",
    "a2a-sdk==1.1.2",
    "agent-framework-foundry",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "debugpy",
    "httpx>=0.28,<1",
    "mcp>=1.30,<2",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
]

[project.scripts]
waiter = "restaurant_agent.cli:main"
waiter-smoke = "restaurant_agent.smoke:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
morcillaconf-contracts = { path = "../../../../packages/contracts", editable = true }
morcillaconf-observability = { path = "../../../../packages/observability", editable = true }
morcillaconf-kitchen-agent = { path = "../../../kitchen/src/kitchen_agent", editable = true }

[tool.setuptools.packages.find]
include = ["restaurant_agent*"]

[tool.setuptools.package-data]
restaurant_agent = ["instructions.md"]
"restaurant_agent.kitchen" = ["instructions.md"]

[dependency-groups]
dev = [
    "morcillaconf-kitchen-agent",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
