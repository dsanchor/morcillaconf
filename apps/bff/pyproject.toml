[project]
name = "morcillaconf-bff"
version = "0.1.0"
description = "BFF FastAPI entre la vista Streamlit y el camarero del restaurante multiagente."
requires-python = ">=3.13"
dependencies = [
    "morcillaconf-contracts",
    "morcillaconf-restaurant-agent",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.30",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
morcillaconf-contracts = { path = "../../packages/contracts", editable = true }
morcillaconf-restaurant-agent = { path = "../../agents/restaurant/src/restaurant_agent", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
