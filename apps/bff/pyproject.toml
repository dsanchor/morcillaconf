[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "morcillaconf-restaurant-agent",
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
