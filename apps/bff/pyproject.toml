[project]
name = "morcillaconf-bff"
version = "0.1.0"
description = "BFF FastAPI entre la vista Streamlit y el camarero del restaurante multiagente."
requires-python = ">=3.13"
dependencies = [
    "morcillaconf-contracts",
    "fastapi>=0.115,<1",
    "httpx>=0.28",
    "mcp>=1.30,<2",
    "uvicorn>=0.30",
    "opentelemetry-api>=1.30",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
morcillaconf-contracts = { path = "../../packages/contracts", editable = true }
morcillaconf-restaurant-agent = { path = "../../agents/restaurant/src/restaurant_agent", editable = true }

[tool.uv]
# Same versions as agents/restaurant/src/restaurant_agent/uv.lock, where the
# waiter was validated. tests/test_lock_alignment.py fails if they drift.
