# Temporary: generates apps/bff/uv.lock in CI. Removed in the commit that adds the lock.
name: Temporary BFF lock

on:
  push:
    paths:
      - apps/bff/pyproject.toml
      - .github/workflows/tmp-bff-lock.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          python-version: "3.13"
      - run: uv lock --project apps/bff
      - run: grep -c '^name = ' apps/bff/uv.lock
      - uses: actions/upload-artifact@v4
        with:
          name: bff-uv-lock
          path: apps/bff/uv.lock
          if-no-files-found: error
