name: Publish frontend image

on:
  push:
    paths:
      - apps/frontend/**
      - packages/contracts/**
      - .dockerignore
      - .github/workflows/frontend-image.yml

permissions:
  contents: read
  packages: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file apps/frontend/Dockerfile --target test --tag morcillaconf-frontend:test .
      - run: docker run --rm morcillaconf-frontend:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/morcillaconf-frontend:${{ github.sha }}
