name: Publish restaurant agent image

on:
  push:
    paths:
      - agents/restaurant/**
      - packages/contracts/**
      - .dockerignore
      - .github/workflows/restaurant-agent-image.yml

permissions:
  contents: read
  packages: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file agents/restaurant/Dockerfile --target test --tag restaurant-agent:test .
      - run: docker run --rm restaurant-agent:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/restaurant/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/morcillaconf-restaurant-agent:${{ github.sha }}
