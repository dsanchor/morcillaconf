name: Publish MCP image

on:
  push:
    paths:
      - services/mcp/**
      - .github/workflows/mcp-image.yml

permissions:
  contents: read
  packages: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file services/mcp/Dockerfile --target test --tag morcillaconf-mcp:test services/mcp
      - run: docker run --rm morcillaconf-mcp:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/mcp
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/morcillaconf-mcp:${{ github.sha }}
