[project]
name = "morcillaconf-contracts"
version = "0.1.0"
description = "Transport-independent public contracts for the restaurant application."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
